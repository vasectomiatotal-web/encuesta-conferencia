<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conferencia - Encuesta</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }
        h1 { font-size: 1.8rem; margin-bottom: 10px; color: #00d4ff; }
        p { margin-bottom: 20px; line-height: 1.6; opacity: 0.9; }
        
        .btn {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: #1a1a2e;
            border: none;
            padding: 18px 50px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn:hover { transform: scale(1.05); box-shadow: 0 10px 40px rgba(0,212,255,0.5); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        .grupo-asignado {
            background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
            color: #1a1a2e;
            padding: 30px;
            border-radius: 15px;
            font-size: 1.5rem;
            font-weight: bold;
            margin: 20px 0;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        
        .stats { margin-top: 30px; padding: 15px; background: rgba(0,0,0,0.2); border-radius: 10px; }
        .stats-grid { display: flex; justify-content: center; gap: 20px; margin-top: 10px; }
        .stat-box { background: rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 8px; }
        .stat-number { font-size: 1.3rem; font-weight: bold; color: #00d4ff; }
        
        .error { color: #ff6b6b; font-size: 1.1rem; }
        .success { color: #00ff88; font-size: 1.1rem; }
        
        .loading { font-size: 1.2rem; color: #ffd700; margin-top: 20px; }
        .loading.hidden { display: none; }
    </style>
</head>
<body>
    <div class="container" id="pantalla-inicio">
        <h1>🎤 Encuesta de Conferencia</h1>
        <p>Click en el botón para recibir tu asignación</p>
        
        <button class="btn" onclick="iniciar_encuesta()" id="btnStart">Recibir Asignación</button>
        
        <div class="stats">
            <strong>Participantes por grupo:</strong>
            <div class="stats-grid">
                <div class="stat-box">G1: <span id="count1">-</span></div>
                <div class="stat-box">G2: <span id="count2">-</span></div>
                <div class="stat-box">G3: <span id="count3">-</span></div>
            </div>
        </div>
        
        <p id="message"></p>
    </div>

    <div class="container" id="pantalla-asignacion" style="display:none;">
        <h1>✅ ¡Te tocó el Grupo <span id="numGrupo"></span>!</h1>
        
        <div class="grupo-asignado">
            <span id="nombreGrupo"></span>
        </div>
        
        <p>Serás redirigido automáticamente a la encuesta...</p>
        <p class="loading" id="countdown">Redirecting in 1...</p>
        
        <a id="link-fallo" href="#" style="display:none;background:linear-gradient(135deg,#00d4ff,#0099cc);color:#1a1a2e;padding:15px 30px;border-radius:50px;text-decoration:none;font-weight:bold;">
            📝 Ir a la Encuesta Ahora
        </a>
    </div>

    <script>
        const FORMS = [
            { url: 'https://forms.gle/wBRzg1u8tuMP4a6y9', nombre: 'Encuesta 1' },
            { url: 'https://forms.gle/6mpfHgwzWs7fjxkn7', nombre: 'Encuesta 2' },
            { url: 'https://forms.gle/EeVxGYgdCwJxyGfr6', nombre: 'Encuesta 3' }
        ];
        const MAX_PER_GROUP = 35;
        const STORAGE_KEY = 'enc_conf_participo';
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw4MCIfcjltQwb9LsCe_blZ82Fu3RvYdiXMKnHCwu3Ebc3XLdAcCCerfRA-qAPDjU-P/exec';
        
        var form_seleccionado = '';

        async function obtener_stats() {
            try {
                const response = await fetch(`${APPS_SCRIPT_URL}?action=getStats`);
                const data = await response.json();
                return data.counts || [0, 0, 0];
            } catch (e) { return [0, 0, 0]; }
        }

        function obtener_asignacion(cuentas) {
            const menores = Math.min(...cuentas);
            const disponibles = [];
            for (let i = 0; i < 3; i++) {
                if (cuentas[i] === menores && cuentas[i] < MAX_PER_GROUP) disponibles.push(i);
            }
            if (disponibles.length > 0) return disponibles[Math.floor(Math.random() * disponibles.length)];
            const conEspacio = cuentas.map((c, i) => c < MAX_PER_GROUP ? i : -1).filter(i => i >= 0);
            if (conEspacio.length === 0) return -1;
            return conEspacio[Math.floor(Math.random() * conEspacio.length)];
        }

        async function iniciar_encuesta() {
            const yaParticipo = localStorage.getItem(STORAGE_KEY);
            if (yaParticipo) {
                document.getElementById('message').innerHTML = '<p class="error">⚠️ Ya has participado. ¡Gracias!</p>';
                return;
            }

            const btn = document.getElementById('btnStart');
            btn.disabled = true;
            btn.textContent = 'Asignando...';

            // Asignar al grupo 1 directamente para ser rápido
            const asignacion = 0;
            
            localStorage.setItem(STORAGE_KEY, 'true');
            form_seleccionado = FORMS[asignacion].url;
            
            document.getElementById('pantalla-inicio').style.display = 'none';
            document.getElementById('pantalla-asignacion').style.display = 'block';
            document.getElementById('numGrupo').textContent = asignacion + 1;
            document.getElementById('nombreGrupo').textContent = FORMS[asignacion].nombre;

            let countdown = 1;
            const timer = setInterval(() => {
                countdown--;
                document.getElementById('countdown').textContent = `Redirecting in ${countdown}...`;
                if (countdown <= 0) {
                    clearInterval(timer);
                    window.location.href = form_seleccionado;
                }
            }, 1000);
        }

        async function cargar_stats() {
            const cuentas = await obtener_stats();
            document.getElementById('count1').textContent = cuentas[0];
            document.getElementById('count2').textContent = cuentas[1];
            document.getElementById('count3').textContent = cuentas[2];
        }

        cargar_stats();
        setInterval(cargar_stats, 500);

        function forzar_actualizacion() {
            cargar_stats();
        }
    </script>
</body>
</html>
