<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas - Encuesta Conferencia</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { 
            text-align: center; 
            font-size: 2rem; 
            margin-bottom: 10px; 
            color: #00d4ff; 
        }
        .subtitle { 
            text-align: center; 
            opacity: 0.7; 
            margin-bottom: 30px; 
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
            transition: transform 0.3s;
        }
        .card:hover { transform: translateY(-5px); }
        .card-number {
            font-size: 3rem;
            font-weight: bold;
            color: #00d4ff;
        }
        .card-label { 
            font-size: 1.1rem; 
            opacity: 0.8; 
            margin-top: 10px; 
        }
        .progress-bar {
            height: 10px;
            background: rgba(255,255,255,0.2);
            border-radius: 5px;
            margin-top: 15px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            transition: width 0.5s;
            border-radius: 5px;
        }
        .total {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: #1a1a2e;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.3rem;
        }
        .last-update {
            text-align: center;
            opacity: 0.5;
            font-size: 0.8rem;
            margin-top: 20px;
        }
        .spreadsheet-link {
            display: block;
            text-align: center;
            margin-top: 30px;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #00d4ff;
            text-decoration: none;
        }
        .spreadsheet-link:hover {
            background: rgba(255,255,255,0.2);
        }
        @media (max-width: 600px) {
            .cards { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Estadísticas en Vivo</h1>
        <p class="subtitle">Conteo de participantes por grupo</p>
        
        <div class="cards">
            <div class="card">
                <div class="card-number" id="count1">0</div>
                <div class="card-label">Grupo 1</div>
                <div class="progress-bar"><div class="progress-fill" id="bar1" style="width:0%"></div></div>
            </div>
            <div class="card">
                <div class="card-number" id="count2">0</div>
                <div class="card-label">Grupo 2</div>
                <div class="progress-bar"><div class="progress-fill" id="bar2" style="width:0%"></div></div>
            </div>
            <div class="card">
                <div class="card-number" id="count3">0</div>
                <div class="card-label">Grupo 3</div>
                <div class="progress-bar"><div class="progress-fill" id="bar3" style="width:0%"></div></div>
            </div>
        </div>
        
        <div class="total">
            Total de participantes: <span id="total">0</span> / 105
        </div>
        
        <a href="#" class="spreadsheet-link" id="sheetLink" target="_blank">
            📄 Ver hoja de cálculo completa
        </a>
        
        <p class="last-update" id="lastUpdate">Última actualización: --</p>
    </div>

    <script>
        // === IMPORTANTE: Reemplaza con tu URL del Apps Script ===
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwegyFt5sPAjF0ocC-66zBY7E_mRlLzkQHbi4MPJCoXripAAW5f71wex6XwmVdD6v-5/exec';
        
        // URL de tu Spreadsheet (opcional - para ver respuestas completas)
        const SPREADSHEET_URL = 'https://docs.google.com/spreadsheets/d/1ShfyZ4HBDAFlg7gEXEoonsdDz7QatzXT1b_S87krEhA/edit';
        const MAX_PER_GROUP = 35;

        async function obtener_stats() {
            try {
                const response = await fetch(`${APPS_SCRIPT_URL}?action=getStats`);
                const data = await response.json();
                return data.counts || [0, 0, 0];
            } catch (e) {
                console.log('Error:', e);
                return [0, 0, 0];
            }
        }

        async function actualizar_estadisticas() {
            const cuentas = await obtener_stats();
            
            document.getElementById('count1').textContent = cuentas[0];
            document.getElementById('count2').textContent = cuentas[1];
            document.getElementById('count3').textContent = cuentas[2];
            
            document.getElementById('bar1').style.width = (cuentas[0] / MAX_PER_GROUP * 100) + '%';
            document.getElementById('bar2').style.width = (cuentas[1] / MAX_PER_GROUP * 100) + '%';
            document.getElementById('bar3').style.width = (cuentas[2] / MAX_PER_GROUP * 100) + '%';
            
            const total = cuentas[0] + cuentas[1] + cuentas[2];
            document.getElementById('total').textContent = total;
            
            document.getElementById('lastUpdate').textContent = 
                'Última actualización: ' + new Date().toLocaleTimeString();
        }

        // Iniciar
        actualizar_estadisticas();
        setInterval(actualizar_estadisticas, 3000);
        
        // Configurar enlace de spreadsheet
        if (SPREADSHEET_URL !== 'TU_SPREADSHEET_URL') {
            document.getElementById('sheetLink').href = SPREADSHEET_URL;
        }
    </script>
</body>
</html>
